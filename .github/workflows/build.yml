name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - name: Tests and debug APK
        run: ./gradlew --no-daemon :firmware-image:test :faceclaw-core:testAndroidHostTest :app:testDebugUnitTest :app:assembleDebug :app:lintDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: g2watch-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
