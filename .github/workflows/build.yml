name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # 37.1 for GeckoView 157 (browser of the watch app and the Gecko test APK), which must be compiled against it.
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "platforms;android-37.1" "build-tools;36.0.0" > /dev/null

      - name: Tests, debug APK and app packages
        run: ./gradlew --no-daemon :firmware-image:test :faceclaw-core:testAndroidHostTest :web-raster:test :app-api:test :app:testDebugUnitTest :app:assembleDebug :app:lintDebug g2appPackages

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: g2watch-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload app packages
        uses: actions/upload-artifact@v4
        with:
          name: g2-apps
          path: build/g2app/*.g2app

      # M2: the GeckoView measuring APK for the Pixel Watch 5 (armeabi-v7a, about 117 MB).
      - name: Gecko test APK
        run: ./gradlew --no-daemon :gecko-probe:testDebugUnitTest :gecko-probe:lintRelease :gecko-probe:assembleRelease

      - name: Upload Gecko test APK
        uses: actions/upload-artifact@v4
        with:
          name: g2-gecko-test-apk
          retention-days: 14
          path: tools/gecko-probe/build/outputs/apk/release/gecko-probe-release.apk

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
