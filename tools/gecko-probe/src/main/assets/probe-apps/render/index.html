<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Render-Test</title>
<style>
  body { margin: 0; font-family: sans-serif; background: #fff; color: #1c1c1e; }
  header { background: #123a6b; color: #fff; padding: 10px 14px; font-weight: bold; font-size: 18px; }
  main { padding: 10px 14px; }
  h1 { font-size: 22px; margin: 6px 0 8px; }
  p { font-size: 16px; line-height: 1.35; margin: 6px 0; }
  a { color: #1a0dab; }
  .hero { position: relative; margin: 10px 0; }
  .hero img { width: 100%; display: block; }
  .hero span { position: absolute; left: 12px; top: 40%; color: #fff; font-size: 20px; font-weight: bold; }
  .card { background: #2b2f38; color: #e8e8ea; padding: 10px; border-radius: 8px; margin: 10px 0; }
</style>
</head>
<body>
<header>G2 Render-Test</header>
<main>
  <h1>Web-Seite auf der Brille</h1>
  <p>Diese Seite hat einen hellen Grund, eine dunkle Kopfzeile, eine dunkle Karte, ein Foto mit Text darüber und einen <a href="#">blauen Link</a>.</p>
  <div class="hero"><img src="landschaft.png" alt="Landschaft"><span>Text über dem Foto</span></div>
  <div class="card">Dunkle Karte mit hellem Text</div>
  <p>Die Uhr rechnet das Bild der Seite in das Raster der Brille um.</p>
</main>
</body>
</html>
